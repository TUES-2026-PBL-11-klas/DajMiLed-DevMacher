grafana:
  enabled: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          folder: DevMatch
          type: file
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      jvm:
        gnetId: 4701
        revision: 1
        datasource: Prometheus
      spring-boot:
        gnetId: 12685
        revision: 1
        datasource: Prometheus

prometheus:
  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    additionalScrapeConfigs:
      - job_name: devmatch-server
        static_configs:
          - targets: ['devmatch-server.devmatch.svc.cluster.local:8080']
        metrics_path: /actuator/prometheus
        scrape_interval: 15s

alertmanager:
  enabled: false
